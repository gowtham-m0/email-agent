[project]
name = "email-agent"
version = "1.0.0"
description = "AI-powered Gmail inbox cleaner — DistilBERT + Groq fallback"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.194.0",
    "google-auth>=2.49.2",
    "google-auth-httplib2>=0.3.1",
    "google-auth-oauthlib>=1.3.1",
    "groq>=1.2.0",
    "gspread==5.12.0",
    "python-dotenv>=1.2.2",
    "transformers>=5.5.4",
    "torch>=2.11.0",
    "accelerate>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.hatch.build.targets.wheel]
only-include = [
    "main.py",
    "ai_classifier.py",
    "config.py",
    "db_manager.py",
    "gmail_client.py",
    "model.py",
    "prompts.py",
    "sheets_logger.py",
    "report_generator.py",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
